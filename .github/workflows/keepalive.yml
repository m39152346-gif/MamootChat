name: Supabase keep-alive

# Audit F19: Supabase free projects pause after ~7 days of inactivity.
# One tiny authenticated REST request every 3 days keeps the project
# awake. This is a workaround, not a fix — the Pro plan removes pausing.
#
# Required repository *variables* (Settings → Secrets and variables →
# Actions → Variables) — the anon/publishable key is safe to expose
# (it ships inside the app), but keep it out of the repo anyway:
#   MAMOOT_URL       e.g. https://<project-ref>.supabase.co
#   MAMOOT_ANON_KEY  the project's publishable (anon) key
# If the variables are missing the job skips quietly. See AUDIT.md
# "MANUAL STEPS".

on:
  schedule:
    - cron: "23 4 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Ping Supabase REST endpoint
        env:
          MAMOOT_URL: ${{ vars.MAMOOT_URL }}
          MAMOOT_ANON_KEY: ${{ vars.MAMOOT_ANON_KEY }}
        run: |
          if [ -z "${MAMOOT_URL:-}" ] || [ -z "${MAMOOT_ANON_KEY:-}" ]; then
            echo "MAMOOT_URL / MAMOOT_ANON_KEY repo variables not set — skipping (see AUDIT.md MANUAL STEPS)."
            exit 0
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "$MAMOOT_URL/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: $MAMOOT_ANON_KEY" \
            -H "Authorization: Bearer $MAMOOT_ANON_KEY")
          echo "Supabase REST responded HTTP $code"
          # 200 (rows) or 401/403 (RLS) both prove the project is awake;
          # only connection-level failures (000) are a real problem.
          [ "$code" != "000" ]
