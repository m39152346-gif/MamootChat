name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "arena/**"
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Prepare signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/signing"
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "Using permanent signing key from repository secrets."
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing/release.p12"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: generating an ephemeral in-runner key. Updates over previous builds will require uninstall until a permanent key is configured."
            PW="$(openssl rand -hex 24)"
            echo "EPHEMERAL_KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"
            keytool -genkeypair -v \
              -keystore "$RUNNER_TEMP/signing/release.p12" -storetype PKCS12 \
              -alias mamoot -keyalg RSA -keysize 3072 -validity 10000 \
              -storepass "$PW" -keypass "$PW" \
              -dname "CN=Mamoot, O=MamootChat" > /dev/null
          fi

      - name: Unit tests + build release APK
        shell: bash
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/signing/release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ]; then export ANDROID_KEYSTORE_PASSWORD="$EPHEMERAL_KEYSTORE_PASSWORD"; fi
          if [ -z "${ANDROID_KEY_PASSWORD:-}" ]; then export ANDROID_KEY_PASSWORD="$EPHEMERAL_KEYSTORE_PASSWORD"; fi
          if [ -z "${ANDROID_KEY_ALIAS:-}" ]; then export ANDROID_KEY_ALIAS="mamoot"; fi
          gradle :app:testDebugUnitTest :app:assembleRelease --stacktrace --no-daemon

      - name: Verify APK and collect outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          APK_SRC="$(find android/app/build/outputs/apk/release -name '*.apk' | head -n1)"
          echo "Built: $APK_SRC"
          cp "$APK_SRC" "$RUNNER_TEMP/out/mamoot.apk"
          (cd "$RUNNER_TEMP/out" && sha256sum mamoot.apk > SHA256.txt)
          BT="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n1)"
          {
            echo "== aapt badging =="
            "$BT/aapt" dump badging "$RUNNER_TEMP/out/mamoot.apk" | head -n 20 || true
            echo
            echo "== zipalign check =="
            "$BT/zipalign" -c -v 4 "$RUNNER_TEMP/out/mamoot.apk" | tail -n 3 || true
            echo
            echo "== apksigner verify =="
            "$BT/apksigner" verify --verbose --print-certs "$RUNNER_TEMP/out/mamoot.apk" || true
            echo
            echo "== unit test results =="
            grep -h -E "tests=|failures=" android/app/build/test-results/testDebugUnitTest/*.xml 2>/dev/null | head -n 20 || true
            echo
            echo "== apk size =="
            ls -lh "$RUNNER_TEMP/out/mamoot.apk"
          } > "$RUNNER_TEMP/out/VERIFICATION.txt" 2>&1
          cat "$RUNNER_TEMP/out/VERIFICATION.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: mamoot-apk
          path: |
            ${{ runner.temp }}/out/mamoot.apk
            ${{ runner.temp }}/out/SHA256.txt
            ${{ runner.temp }}/out/VERIFICATION.txt
          if-no-files-found: error

      - name: Publish APK to apk-latest branch (git-fetchable copy)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/out"
          git init -q -b apk-latest .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          {
            echo "# Mamoot Android build"
            echo
            echo "Built from commit $GITHUB_SHA (ref $GITHUB_REF)."
            echo "Files: mamoot.apk, SHA256.txt, VERIFICATION.txt"
          } > README.md
          git add mamoot.apk SHA256.txt VERIFICATION.txt README.md
          git commit -q -m "Android APK from $GITHUB_SHA"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:apk-latest
